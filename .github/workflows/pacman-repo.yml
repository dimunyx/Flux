name: Package repositories

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Arch package and repository
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed \
              cmake ninja clang pkgconf glfw freetype2 fontconfig libpng libepoxy libglvnd
            useradd -m builder
            chown -R builder:builder /src
            su builder -c "cd /src/packaging/arch && makepkg -f --noconfirm"
            mkdir -p /src/repo
            cp /src/packaging/arch/*.pkg.tar.zst /src/repo/
            repo-add /src/repo/flux.db.tar.gz /src/repo/flux-*.pkg.tar.zst
            rm -f /src/repo/*.old /src/repo/flux.db /src/repo/flux.files
            cp /src/repo/flux.db.tar.gz /src/repo/flux.db
            cp /src/repo/flux.files.tar.gz /src/repo/flux.files
          '

      - name: Build the Fedora RPM repository
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -euo pipefail -c '
            dnf install -y clang cmake make rpm-build createrepo_c glfw-devel \
              freetype-devel fontconfig-devel libpng-devel libepoxy-devel \
              libglvnd-devel pkgconf-pkg-config
            cmake -S . -B build/rpm -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX=/usr \
              -DFLUX_NATIVE=OFF
            cmake --build build/rpm --parallel
            mkdir -p packaging/rpm /src/repo/rpm
            cpack -G RPM --config build/rpm/CPackConfig.cmake -B packaging/rpm
            cp packaging/rpm/*.rpm /src/repo/rpm/
            createrepo_c /src/repo/rpm
          '

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: flux-rpm-${{ github.sha }}
          path: packaging/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
